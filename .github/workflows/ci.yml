name: CI

on:
  push:
    branches:
      - "fix/**"
      - "rebuild/**"
  pull_request:
    branches:
      - main
      - "rebuild/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kpims_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kpims_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kpims_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Prepare disposable test database
        run: bunx prisma db push

      - name: Seed canonical master data
        run: bun run seed

      - name: Verify production-safe master seed
        run: bun run seed:master

      - name: Automated tests
        run: bun run test
