name: CI

on:
  push:
    branches:
      - "fix/**"
      - "rebuild/**"
  pull_request:
    branches:
      - main
      - "rebuild/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kpims_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Automated tests
        run: bun run test
